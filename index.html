
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LAUNDRY IBU TINI | Sistem Manajemen Cerdas</title>
    
    <!-- Meta untuk Netlify & PWA Optimization -->
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Sistem manajemen laundry profesional untuk Ibu Tini. Pelacakan pesanan real-time dan manajemen admin yang efisien.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #60a5fa;
            --bg-light: #f0f9ff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            overflow-x: hidden;
            background-color: var(--bg-light);
            min-height: 100vh;
            /* Support for notch on modern phones */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* Thematic Background Elements */
        .bg-laundry-theme {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
            background: 
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(37, 99, 235, 0.05) 0%, transparent 50%),
                linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        }

        .soap-bubble {
            position: absolute;
            bottom: -150px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.1) 60%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            box-shadow: 
                inset -5px -5px 15px rgba(255, 255, 255, 0.4),
                inset 5px 5px 15px rgba(186, 230, 253, 0.3),
                0 0 20px rgba(255, 255, 255, 0.15);
            animation: rise var(--duration) infinite ease-in-out;
            backdrop-filter: blur(1px);
            pointer-events: none;
        }

        @keyframes rise {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-130vh) translateX(var(--drift)) scale(1.5); opacity: 0; }
        }

        .soap-bubble:nth-child(1) { left: 5%; width: 45px; height: 45px; --duration: 12s; --drift: 40px; animation-delay: 0s; }
        .soap-bubble:nth-child(2) { left: 15%; width: 25px; height: 25px; --duration: 15s; --drift: -20px; animation-delay: 4s; }
        .soap-bubble:nth-child(3) { left: 30%; width: 60px; height: 60px; --duration: 18s; --drift: 60px; animation-delay: 1s; }
        .soap-bubble:nth-child(4) { left: 55%; width: 35px; height: 35px; --duration: 14s; --drift: -30px; animation-delay: 6s; }
        .soap-bubble:nth-child(5) { left: 75%; width: 50px; height: 50px; --duration: 20s; --drift: 20px; animation-delay: 2s; }
        .soap-bubble:nth-child(6) { left: 88%; width: 30px; height: 30px; --duration: 16s; --drift: -50px; animation-delay: 8s; }

        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes slide-up { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes scale-in { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }

        .animate-spin-slow { animation: spin-slow 20s linear infinite; }
        .animate-slide-up { animation: slide-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-scale-in { animation: scale-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .pulse-soft { animation: pulse-soft 2s ease-in-out infinite; }

        /* Custom Scrollbar for sleek look on desktop */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",

  }
}
</script>
</head>
<body class="text-slate-900 selection:bg-blue-100 selection:text-blue-900">
    <div class="bg-laundry-theme">
        <div class="soap-bubble"></div>
        <div class="soap-bubble"></div>
        <div class="soap-bubble"></div>
        <div class="soap-bubble"></div>
        <div class="soap-bubble"></div>
        <div class="soap-bubble"></div>
    </div>
    <div id="root"></div>
</body>
</html>
