
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAUNDRY IBU TINI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            overflow-x: hidden;
            background-color: #f0f9ff;
            min-height: 100vh;
        }

        /* Thematic Background Elements */
        .bg-laundry-theme {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
            background: 
                radial-gradient(circle at 20% 30%, rgba(186, 230, 253, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(186, 230, 253, 0.4) 0%, transparent 50%),
                linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        }

        /* Fabric Texture Overlay */
        .bg-laundry-theme::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23000000' fill-opacity='1' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='3'/%3E%3Ccircle cx='13' cy='13' r='3'/%3E%3C/g%3E%3C/svg%3E");
        }

        .soap-bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            box-shadow: 
                inset -5px -5px 15px rgba(255, 255, 255, 0.5),
                inset 5px 5px 15px rgba(186, 230, 253, 0.3),
                0 0 20px rgba(255, 255, 255, 0.2);
            animation: rise var(--duration) infinite linear;
            backdrop-filter: blur(1px);
        }

        .soap-bubble::after {
            content: "";
            position: absolute;
            top: 15%;
            left: 15%;
            width: 25%;
            height: 25%;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            50% { transform: translateY(-50vh) translateX(20px) scale(1.1); }
            100% {
                transform: translateY(-110vh) translateX(-20px) scale(1.2);
                opacity: 0;
            }
        }

        /* Bubble variations */
        .soap-bubble:nth-child(1) { left: 5%; width: 40px; height: 40px; --duration: 12s; animation-delay: 0s; }
        .soap-bubble:nth-child(2) { left: 15%; width: 25px; height: 25px; --duration: 15s; animation-delay: 2s; }
        .soap-bubble:nth-child(3) { left: 30%; width: 55px; height: 55px; --duration: 18s; animation-delay: 4s; }
        .soap-bubble:nth-child(4) { left: 45%; width: 30px; height: 30px; --duration: 14s; animation-delay: 1s; }
        .soap-bubble:nth-child(5) { left: 60%; width: 50px; height: 50px; --duration: 20s; animation-delay: 3s; }
        .soap-bubble:nth-child(6) { left: 75%; width: 20px; height: 20px; --duration: 16s; animation-delay: 5s; }
        .soap-bubble:nth-child(7) { left: 85%; width: 45px; height: 45px; --duration: 13s; animation-delay: 7s; }
        .soap-bubble:nth-child(8) { left: 95%; width: 35px; height: 35px; --duration: 17s; animation-delay: 2s; }

        .whatsapp-float {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 24px;
            right: 24px;
            background-color: #25d366;
            color: #FFF;
            border-radius: 50px;
            text-align: center;
            font-size: 30px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .whatsapp-float:hover {
            transform: scale(1.1) rotate(5deg);
        }
        .whatsapp-pulse {
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: #25d366;
            border-radius: 50px;
            z-index: -1;
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { transform: scale(1.3); box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }
        .wa-label {
            position: absolute;
            right: 70px;
            background: white;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #25d366;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform: translateX(10px);
            transition: all 0.3s ease;
        }
        .whatsapp-float:hover .wa-label {
            opacity: 1;
            transform: translateX(0);
        }
    </style>

</head>

        <div class="soap-bubble"></div>

        <div class="soap-bubble"></div>
        <div class="soap-bubble"></div>
        <div class="soap-bubble"></div>
        <div class="soap-bubble"></div>
        <div class="soap-bubble"></div>
        <div class="soap-bubble"></div>

</html>
